{% extends "base.html" %}

{% block title %}
<title>{{ page_title }}</title>
{% endblock %}

{% block content %}

{% for error in errors %}
<div class="alert alert-danger">
    <li>{{ error }}</li>
</div>
{% endfor %}

<div class="container">
    <div class="text-center display-4">{{ heading }}</div>

    <div class="row mt-3 mb-5">
        <div class="col-3"></div>

        <div class="col-6">
            <!-- UPDATE SUPPORT -->
            <form method="POST" action="{{ action_url }}">

                <!-- UPDATE SUPPORT -->
                {% if is_update %}
                <input type="hidden" name="_method" value="PUT">
                {% endif %}

                <label>Title</label>
                <input
                    type="text"
                    required
                    class="form-control mb-2"
                    name="title"
                    value="{{ blog.title if blog else title }}"
                    placeholder="Enter a Title"
                >

                <label>Content</label>
                <textarea
                    name="content"
                    class="form-control mb-2"
                >{{ blog.content if blog else content }}</textarea>

                <button type="submit" class="btn btn-outline-success">
                    {{ button_text }}
                </button>
            </form>
        </div>

        <div class="col-3"></div>
    </div>
</div>

{% endblock %}
